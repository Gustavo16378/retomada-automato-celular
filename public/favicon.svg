<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Miniatura do próprio autômato: solo contaminado à esquerda, vegetação retomando à direita. -->
  <rect width="16" height="16" fill="#3a2a1d" />
  <rect x="0" y="0" width="6" height="6" fill="#7b3fa8" />
  <rect x="6" y="2" width="4" height="4" fill="#cbd62f" />
  <rect x="10" y="0" width="6" height="6" fill="#a4843a" />
  <rect x="0" y="10" width="5" height="6" fill="#5c9e3f" />
  <rect x="5" y="8" width="6" height="8" fill="#3a7d33" />
  <rect x="11" y="10" width="5" height="6" fill="#21592a" />
  <rect x="7" y="6" width="2" height="2" fill="#d9453a" />
</svg>
